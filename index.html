<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trivia del Conocimiento - Examen de JavaScript</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="main-header">
      <div class="header-container">
        <h1>🧠 Trivia del Conocimiento</h1>
        <p class="subtitle">Pon a prueba tus conocimientos con preguntas interactivas</p>
      </div>
    </header>

    <main class="main-container">
      <section class="card panel-control">
        <div class="control-row">
          <div class="form-group">
            <label for="select-categoria">Seleccionar Categoría:</label>
            <select id="select-categoria">
              <option value="todas">Todas las categorías</option>
            </select>
          </div>
          <button type="button" id="btn-iniciar" class="btn btn-primary">Cargar Preguntas</button>
        </div>
        <div class="marcador-container">
          <span class="marcador-label">Puntaje Actual:</span>
          <span id="puntaje-actual" class="marcador-valor">0</span>
        </div>
      </section>

      <section id="pregunta-card" class="card pregunta-card hidden">
        <div class="pregunta-header">
          <span id="categoria-badge" class="badge">Categoría</span>
          <span id="pregunta-numero" class="pregunta-contador">Pregunta 1</span>
        </div>
        <h2 id="pregunta-texto" class="pregunta-texto">Texto de la pregunta</h2>
        <div id="opciones-container" class="opciones-grid">
          <!-- Opciones inyectadas dinámicamente -->
        </div>
        <div id="feedback-mensaje" class="mensaje hidden"></div>
        <div class="acciones-pregunta">
          <button type="button" id="btn-siguiente" class="btn btn-primary hidden">
            Siguiente Pregunta ➡️
          </button>
        </div>
      </section>

      <section class="card historial-section">
        <div class="historial-header">
          <h2>📋 Historial de Respuestas</h2>
          <button type="button" id="btn-limpiar-historial" class="btn btn-outline">
            Limpiar Historial
          </button>
        </div>
        <ul id="historial-lista" class="historial-lista">
          <!-- Historial dinámico -->
        </ul>
      </section>
    </main>

    <footer class="main-footer">
      <p>Programación II - Examen Práctico de Frontend con JavaScript</p>
    </footer>

    <script type="module" src="js/script.js"></script>
  </body>
</html>
